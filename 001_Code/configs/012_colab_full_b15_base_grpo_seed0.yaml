# Experiment 012: base-to-grpo at 1.5b, seed 0, mirrors 005 (0.5b) and 004 (3b).
# The open question is whether grpo without the gsm8k warm start collapses on
# format like 0.5b did or merely lags like 3b. Frozen protocol v1, a100
experiment: "012"
env: COLAB
mode: FULL
scale: B15
condition: BASE_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 500
  num_generations: 8
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  seed: 0

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_total_limit: 10

output_root: /content/drive/MyDrive/inm363

# Execution knobs (outside the freeze, memory only). 1.5b sits well inside a100
# memory (3b peaked at 50gb), so defaults apply and the oom ladder covers surprises
exec:
  grpo_batch_size: null
  grpo_grad_accum: 1
  gradient_checkpointing: false
  max_train_hours: 24   # sentinel a4: abort at step 20 if the projection says more
