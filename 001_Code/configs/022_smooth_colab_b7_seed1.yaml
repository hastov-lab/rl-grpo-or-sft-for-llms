# Experiment 022 seed 1: smooth 1000-step grpo at 7b, the E1 arm of the
# locked package. Same merged gsm8k base its 013 counterpart used, doubled
# steps under one linear schedule, checkpoints every 100 steps so the
# registered eval grid survives. Ladder off as everywhere in the family
# exploratory
experiment: "022_smooth"
exploratory: true
env: COLAB
mode: FULL
scale: B7
condition: SFT_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 1000
  num_generations: 8
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  seed: 1

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_steps: 100
  save_total_limit: 12

output_root: /content/drive/MyDrive/inm363

# execution knobs: the pilot-locked originals, shared with every other scale
exec:
  grpo_batch_size: null
  grpo_grad_accum: 1
  gradient_checkpointing: false
  max_train_hours: 24   # sentinel a4: abort at step 20 if the projection says more
  allow_oom_fallback: false
