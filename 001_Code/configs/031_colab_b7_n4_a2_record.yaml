# Experiment 031: continue the stopped N=4 seed 1 trajectory
# Exploratory validation of the recorded a2 decision
experiment: "031"
exploratory: true
env: COLAB
mode: FULL
scale: B7
condition: EXTERNAL_SFT_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 500
  num_generations: 4
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  grpo_from_adapter: checkpoints/013_COLAB_FULL_B7_sft_grpo_seed1/sft
  a2_action: record
  seed: 1

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_total_limit: 10

output_root: /content/drive/MyDrive/inm363

# execution settings match the stopped 030 seed 1 arm
exec:
  grpo_batch_size: null
  grpo_grad_accum: 1
  gradient_checkpointing: false
  max_train_hours: 24
  allow_oom_fallback: false

