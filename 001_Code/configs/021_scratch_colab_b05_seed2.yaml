# Experiment 021 seed 2: from-scratch 1000-step schedule-regime control.
# Fresh GRPO on the same merged GSM8K base the 006 counterpart used, one
# smooth 1000-step schedule against the observed 500+500 restarted regime.
# exploratory
experiment: "021_scratch"
exploratory: true
env: COLAB
mode: FULL
scale: B05
condition: SFT_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 1000
  num_generations: 8
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  seed: 2

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_total_limit: 10

output_root: /content/drive/MyDrive/inm363


exec:
  max_train_hours: 12
  allow_oom_fallback: false
