# Experiment 013 seed 0: the 7b extension, prospectively registered, frozen
# protocol v1, a100-80gb only. Pilot A (22 jul) passed at the ORIGINAL exec
# settings, so batch, accumulation and checkpointing match the 003 exec. The ladder is off per
# the no-mutation rule: a failed run gets archived and restarted, never mutated
experiment: "013"
env: COLAB
mode: FULL
scale: B7
condition: SFT_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 500
  num_generations: 8
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  seed: 0

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_total_limit: 10

output_root: /content/drive/MyDrive/inm363

# execution knobs: the pilot-locked originals, shared with every other scale
exec:
  grpo_batch_size: null
  grpo_grad_accum: 1
  gradient_checkpointing: false
  max_train_hours: 24   # sentinel a4: abort at step 20 if the projection says more
  allow_oom_fallback: false
