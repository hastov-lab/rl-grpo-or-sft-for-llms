# Experiment 028 seed 1: grpo on top of the seed-matched mc-sft adapter
# (w14, the composition recipe). Fixed exploratory arm, frozen
# grpo protocol, settings byte-matched to the 013 seed config apart from the
# registered differences: experiment, condition, source adapter, exploratory
experiment: "028"
exploratory: true
env: COLAB
mode: FULL
scale: B7
condition: MCSFT_GRPO

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

reward:
  correct_weight: 1.0
  format_weight: 0.2
  min_think_chars: 20

train:
  sft_lr: 1.0e-4
  grpo_lr: 1.0e-5
  max_steps: 500
  num_generations: 8
  max_seq_len: 1024
  sft_batch_size: 4
  sft_grad_accum: 4
  sft_completion_only: true
  sft_val_examples: 500
  dtype: auto
  grpo_from_adapter: checkpoints/014_p8_COLAB_FULL_B7_sft_only_seed1/sft
  seed: 1

grpo:
  loss_type: grpo
  beta: 0.04
  scale_rewards: group
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512

eval:
  max_new_tokens: 512
  batch_size: 16

log:
  wandb_mode: online
  save_total_limit: 10

output_root: /content/drive/MyDrive/inm363

# execution knobs: the pilot-locked originals, shared with every other scale
exec:
  grpo_batch_size: null
  grpo_grad_accum: 1
  gradient_checkpointing: false
  max_train_hours: 24   # sentinel a4: abort at step 20 if the projection says more
  allow_oom_fallback: false
