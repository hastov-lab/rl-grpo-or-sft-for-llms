[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inm363-gpt2-scratch"
version = "0.1.0"
description = "GPT-2 implementation adapted for the experiments in this study"
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.7",
    "tiktoken>=0.12",
    "torch>=2.9",
    "transformers==5.5.4",
]

[tool.setuptools.packages.find]
include = ["gpt2_scratch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
